name: Build SansVM IPA

# v1: stock UTM full iOS build, renamed SansVM-unsigned.ipa
# Built-in StikJIT code is in jit/ in this repo, NOT yet merged into UTM's
# Xcode project. Merging a helper extension into UTM is high risk and would
# break the first build. v1 proves the UTM + Sysroot build goes green first,
# v2 merges the helper.
#
# How UTM builds, from utmapp/UTM .github/workflows/build.yml:
# - job 1 builds Sysroot ios-arm64 from source with
#   ./scripts/build_dependencies.sh -p ios -a arm64, cached in Actions cache
# - job 2 restores that Sysroot, then
#   ./scripts/build_utm.sh -k iphoneos -s iOS -a arm64 -o UTM
# - package with ./scripts/package.sh ipa
# Sysroot build is slow on first run (QEMU deps), cached after that.
# iOS 26 fix (run #5 failed on Swift errors): UTM main builds the app
# target at IPHONEOS_DEPLOYMENT_TARGET 15.0 (project-level in
# UTM.xcodeproj/project.pbxproj; only iOSHelper is 26.0). build_utm.sh has
# no target option and an env var loses to the project setting, so the
# build-utm job patches project.pbxproj 15.0 -> 26.0 before building.
# That patch only fixes dismissalConfirmationDialog (iOS 26 API).
# AUDIT 2026-11-24: it does NOT fix the other 4 run #5 errors.
# sceneAccessory / ExternalNonInteractiveAccessory and
# ToolbarItem.visibilityPriority are iOS 27 APIs, only #available-guarded
# in UTM source (no canImport check), so they need the iOS 27 SDK:
# the build-utm job runs on xcode-27 (Xcode 27, iOS 27 SDK). The sysroot
# job stays on macos-26: its cached libs were built there and are plain
# C archives, fine to link under Xcode 27.
# Sysroot stays cached from run #5; its libs were built at 15.0 min, which
# still links fine for a 26.0 app.
# Package step needs ldid: UTM's own CI does `brew install ldid` before
# package.sh; without it package.sh fails at fake_sign and the workflow
# silently falls back to an unsigned zip with no fake entitlements.
# Cache-save fix: save whenever the restore was not an exact-key hit
# (matched != primary), not only on a total miss — otherwise a UTM
# scripts change makes the sysroot job reuse a stale prefix-matched
# cache, skip the save, and the UTM job then fails on fail-on-cache-miss.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild_sysroot:
        description: 'Force rebuild sysroot?'
        required: true
        default: 'false'

env:
  RUNNER_IMAGE: macos-26

jobs:
  build-sysroot:
    name: Build Sysroot ios-arm64
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Clone UTM (recursive)
        run: |
          git clone --recursive https://github.com/utmapp/UTM.git utm
          cd utm && git log -1 --oneline

      - name: Check Sysroot cache
        id: cache-sysroot
        uses: actions/cache/restore@v4
        with:
          path: utm/sysroot-ios-arm64
          key: ios-arm64-${{ hashFiles('utm/scripts/build_dependencies.sh', 'utm/scripts/fixup.sh') }}-${{ hashFiles('utm/patches/**') }}
          restore-keys: ios-arm64-
          lookup-only: false

      - name: Setup Path
        run: |
          echo "/usr/local/opt/bison/bin:/opt/homebrew/opt/bison/bin" >> $GITHUB_PATH

      - name: Install Requirements
        if: steps.cache-sysroot.outputs.cache-matched-key == '' || github.event.inputs.rebuild_sysroot == 'true'
        run: |
          brew uninstall cmake || true
          brew install bison pkg-config gettext glib-utils libgpg-error nasm make meson cmake spirv-tools
          brew install llvm spirv-llvm-translator libxcb libxrandr || true
          pip3 install --break-system-packages --user six pyparsing pyyaml setuptools distlib mako || pip3 install --user six pyparsing pyyaml setuptools distlib mako
          gem install --user-install xcpretty || true
          rm -f /usr/local/lib/pkgconfig/*.pc || true

      - name: Build Sysroot
        if: steps.cache-sysroot.outputs.cache-matched-key == '' || github.event.inputs.rebuild_sysroot == 'true'
        run: |
          cd utm
          ./scripts/build_dependencies.sh -p ios -a arm64
        env:
          NCPU: 0

      - name: Save Sysroot cache
        if: steps.cache-sysroot.outputs.cache-matched-key != steps.cache-sysroot.outputs.cache-primary-key
        uses: actions/cache/save@v4
        with:
          path: utm/sysroot-ios-arm64
          key: ${{ steps.cache-sysroot.outputs.cache-primary-key }}
          upload-chunk-size: 1048576

  build-utm:
    name: Build UTM iOS
    runs-on: xcode-27
    needs: build-sysroot
    timeout-minutes: 120
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Clone UTM (recursive)
        run: |
          git clone --recursive https://github.com/utmapp/UTM.git utm
          cd utm && git log -1 --oneline

      - name: Set iOS deployment target to 26.0
        run: |
          perl -pi -e 's/IPHONEOS_DEPLOYMENT_TARGET = 15\.0;/IPHONEOS_DEPLOYMENT_TARGET = 26.0;/g' utm/UTM.xcodeproj/project.pbxproj
          echo "--- deployment targets after patch ---"
          grep -n "IPHONEOS_DEPLOYMENT_TARGET" utm/UTM.xcodeproj/project.pbxproj
          # Fail loudly if the patch did not apply (e.g. UTM removed the 15.0 lines)
          if grep -q "IPHONEOS_DEPLOYMENT_TARGET = 15\.0;" utm/UTM.xcodeproj/project.pbxproj; then
            echo "ERROR: deployment-target patch did not remove all 15.0 targets"
            exit 1
          fi

      - name: Restore Sysroot cache
        uses: actions/cache/restore@v4
        with:
          path: utm/sysroot-ios-arm64
          key: ios-arm64-${{ hashFiles('utm/scripts/build_dependencies.sh', 'utm/scripts/fixup.sh') }}-${{ hashFiles('utm/patches/**') }}
          restore-keys: ios-arm64-
          fail-on-cache-miss: true

      - name: Select Xcode
        # Same guard as UTM's own CI: xcode-27 defaults to Xcode 27, but
        # pin the selection explicitly so a default drift cannot silently
        # drop us back to an SDK without the iOS 27 APIs.
        run: |
          [[ "$(xcode-select -p)" == "/Applications/Xcode.app"* ]] || sudo xcode-select -s "/Applications/Xcode.app"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build UTM for iOS (full, not SE)
        run: |
          cd utm
          ./scripts/build_utm.sh -k iphoneos -s iOS -a arm64 -o UTM
          ls -lh UTM.xcarchive/Products/Applications/ || true

      - name: Install ldid for fake-signing
        # package.sh fake-signs with ldid; UTM's own CI installs it before
        # packaging. Without it package.sh fails and the fallback zip has
        # no fake entitlements (get-task-allow, dynamic-codesigning, ...).
        run: brew install ldid

      - name: Package unsigned IPA
        run: |
          cd utm
          mkdir -p ../output
          ./scripts/package.sh ipa UTM.xcarchive ../output || \
            (mkdir -p Payload && cp -r UTM.xcarchive/Products/Applications/UTM.app Payload/ && zip -r ../output/SansVM-unsigned.ipa Payload)
          ls -lh ../output/
          # Rename UTM.ipa to SansVM if package.sh made that name
          if [ -f ../output/UTM.ipa ]; then mv ../output/UTM.ipa ../output/SansVM-unsigned.ipa; fi
          ls -lh ../output/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SansVM-unsigned
          path: output/*.ipa
          if-no-files-found: error
